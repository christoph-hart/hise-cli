schemaVersion: 1
mode:
  id: mcp
  title: HISE MCP documentation bridge
  summary: Call the HISE documentation server REST tool API through hise-cli.
  invocation:
    - argv: [hise-cli, mcp, search_hise, --query, Content.addKnob, --domain, api, --limit, "3", --agent]
    - argv: [hise-cli, mcp, explore_hise, --query, sampler, --agent]
    - argv: [hise-cli, mcp, get_resource, --id, hisescript-style, --agent]
  notes:
    - hise-cli mcp uses the stateless HISE docs REST API, not Streamable HTTP sessions.
    - hise-cli mcp preserves the REST tool result under the normal hise-cli JSON envelope.
    - Use --args-stdin or --args-file for nested or complex MCP arguments; keep inline --args only for tiny JSON.
    - Use docs lookup before inventing HiseScript APIs, UI properties, module parameters, or LAF functions.
  antiPatterns:
    - avoid: Guessing HiseScript APIs from JavaScript knowledge.
      prefer: hise-cli mcp query_scripting_api --api-call ScriptSlider.setControlCallback --agent
capabilities:
  - id: mcp.tool.fields
    title: Call an MCP tool with field flags
    purpose: Call a HISE MCP tool using CLI-friendly flags that map to MCP arguments.
    command:
      argv: [hise-cli, mcp, explore_hise, --query, sampler, --agent]
    examples:
      - title: Explore sampler concepts
        argv: [hise-cli, mcp, explore_hise, --query, sampler, --agent]
      - title: Search for an API method
        argv: [hise-cli, mcp, search_hise, --query, Content.addKnob, --domain, api, --limit, "3", --agent]
    tags: [mcp, docs, tool, fields]
    aliases:
      - call hise mcp tool
      - use mcp docs bridge
      - search hise docs from cli
    help:
      visibility: common
      order: 10
  - id: mcp.tool.json
    title: Call an MCP tool with exact JSON arguments
    purpose: Call a HISE MCP tool with exact JSON arguments for complex or nested inputs.
    command:
      argv: [hise-cli, mcp, explore_hise, --args-stdin, --agent]
    examples:
      - title: Explore docs only
        argv: [hise-cli, mcp, explore_hise, --args-stdin, --agent]
        stdin: '{"query":"sampler","source":"docs"}'
    tags: [mcp, docs, json, passthrough]
    aliases:
      - exact mcp args
      - mcp json arguments
      - pass json to mcp tool
    help:
      visibility: common
      order: 20
  - id: mcp.raw.method
    title: List REST tools
    purpose: List mirrored HISE docs tools exposed by the REST API.
    command:
      argv: [hise-cli, mcp, tools/list, --agent]
    examples:
      - title: List MCP tools
        argv: [hise-cli, mcp, tools/list, --agent]
    tags: [mcp, docs, tools, discovery]
    aliases:
      - list mcp tools
      - list hise docs tools
    help:
      visibility: common
      order: 30
  - id: mcp.search.docs
    title: Search HISE documentation
    purpose: Search HISE docs by keyword, API symbol, module type, UI component, or scriptnode concept.
    command:
      argv: [hise-cli, mcp, search_hise, --query, Content.addKnob, --domain, api, --limit, "3", --agent]
    examples:
      - title: Search API docs
        argv: [hise-cli, mcp, search_hise, --query, Content.addKnob, --domain, api, --limit, "3", --agent]
    tags: [mcp, docs, search, api]
    aliases:
      - search hise docs
      - find hise api docs
      - lookup hise documentation
    help:
      visibility: common
      order: 40
  - id: mcp.explore.semantic
    title: Explore HISE concepts semantically
    purpose: Use semantic HISE docs discovery when you do not know the exact API class or method.
    command:
      argv: [hise-cli, mcp, explore_hise, --query, create slider callback, --domain, ui, --source, docs, --timeout, "180", --agent]
    examples:
      - title: Explore slider callbacks
        argv: [hise-cli, mcp, explore_hise, --query, create slider callback, --domain, ui, --source, docs, --timeout, "180", --agent]
    tags: [mcp, docs, semantic, explore]
    aliases:
      - semantic hise search
      - explore hise concepts
      - find the right hise class
    notes:
      - The first semantic call can be slower if the MCP server is warming up an embedding model.
    help:
      visibility: common
      order: 50
  - id: mcp.query.api
    title: Query exact HiseScript API details
    purpose: Get exact method signatures, parameter details, examples, and pitfalls for a HiseScript API class or method.
    command:
      argv: [hise-cli, mcp, query_scripting_api, --api-call, ScriptSlider.setControlCallback, --agent]
    examples:
      - title: Query setControlCallback
        argv: [hise-cli, mcp, query_scripting_api, --api-call, ScriptSlider.setControlCallback, --agent]
    tags: [mcp, api, hissescript, docs]
    aliases:
      - query hise api method
      - get hise method signature
      - verify hise api call
    help:
      visibility: common
      order: 60
